[workspace]
resolver = "2"
members = [
    "crates/r3st-core",
    "crates/r3st-api",
    "crates/r3st-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/lvjp/r3st"
authors = ["Laurent VERDOÏA"]

[workspace.dependencies]
# Internal
r3st-core = { path = "crates/r3st-core" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = "0.8"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
